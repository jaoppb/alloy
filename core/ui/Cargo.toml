[package]
name = "ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The browser chrome as a widget domain: UI render tree, hit testing, theme, omnibox (#109, ADR-0026)."

# Sibling of `core/browser` (ADR-0026): neither depends on the other, and `alloy`'s
# executor mediates between their effect enums. The chrome sees the page only as
# opaque `region::ContentRegion`s. It names no `css`, `dom`, `engine` or thread —
# enforced by `arch-lint.toml`.
[dependencies]
# Domain types and the display-list builder only; the rasterizer stays off.
graphics = { path = "../graphics", default-features = false }
# `Url`, `NetworkError`; the sockets and TLS stay off.
network = { path = "../network", default-features = false }
platform = { path = "../platform" }
region = { path = "../region" }
thiserror = { workspace = true }
# Event vocabulary only (`SurfaceSize`, `PhysicalPosition`, `LogicalKey`, `InputText`); no winit.
window = { path = "../window", default-features = false }

[lints]
workspace = true
