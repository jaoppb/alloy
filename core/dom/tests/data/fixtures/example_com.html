<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Example Domain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #f0f0f2; margin: 0; padding: 0; font-family: sans-serif; }
        div { width: 600px; margin: 5em auto; padding: 2em; background-color: #fdfdff; border-radius: 0.5em; }
        h1 { font-size: 2em; }
        p { color: #333333; line-height: 1.5; }
    </style>
</head>
<body>
<div>
    <h1>Example Domain</h1>
    <p>This domain is for use in illustrative examples in documents. You may use this
    domain in literature without prior coordination or asking for permission.
    <p>More information is available at <a href="https://www.iana.org/domains/example">IANA-managed Reserved Domains</a>.
    <ul>
        <li>Documentation reference
        <li>Standards compliance
    </ul>
    <hr>
    <!-- Script demonstrating rawtext handling where markup inside quotes is not parsed -->
    <script>
        const message = "<div>This inner string is not an element</div>";
        if (5 < 10 && 10 > 2) {
            console.log(message);
        }
    </script>
</div>
</body>
</html>
