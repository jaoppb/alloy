[package]
name = "graphics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Declarative display lists and the replaceable RenderBackend port (PRD-005, ADR-0009, ADR-0011)."

# The first `[features]` section in the workspace. `ADR-0011:99-102` item 6 asks
# every port for a `no-<adapter>` build: `--no-default-features` links no concrete
# rasterizer at all, leaving the display list, the port and the conformance suite
# to stand on their own. Note that until this crate existed, the `--all-features`
# and `--no-default-features` flags already in CI were no-ops.
[features]
default = ["software-backend"]
software-backend = []

[dependencies]
thiserror = { workspace = true }
# B3 real text rasterization: TtfParserProvider / SystemFontProvider. Always on —
# SyntheticFontProvider (the deterministic default every golden/conformance test
# uses) lives in this crate too, so `--no-default-features` still needs the type
# even with `software-backend` off.
ttf-parser = { workspace = true }
# Phase X image support: reexport of network::inflate (RFC 1951 / zlib for PNG IDAT).
# default-features = false links no socket and no crypto.
network = { path = "../network", default-features = false }

[lints]
workspace = true
