# arch-lint — machine-enforced architecture rules for the Alloy workspace.
# Docs: https://github.com/ynishi/arch-lint   ·   run: `just arch` (or `arch-lint check`)

[analyzer]
exclude = [
    "**/target/**",
    "**/node_modules/**",
    # The port conformance suite (ADR-0011 item 6) is assertion code by nature —
    # it is `pub` (not `#[cfg(test)]`) only so adapter `tests/` can import it, and
    # it `panic!`s / `.expect()`s on the first violation on purpose.
    "core/engine/src/conformance.rs",
    "core/graphics/src/application/conformance.rs",
    # The golden-image gate is the same kind of code: it panics on mismatch on
    # purpose, and a missing reference is a test-authoring error.
    "core/graphics/src/infrastructure/golden.rs",
    # The CSS port conformance suite is the same assertion-code carve-out
    # (ADR-0011 item 6), and the manifest runner is a two-way-consistency gate
    # that panics on divergence by design.
    "core/css/src/application/conformance.rs",
    "core/css/tests/manifest_runner.rs",
    # The network conformance suite is the same assertion-code carve-out
    # (ADR-0011 item 6): `pub`, not `#[cfg(test)]`, panics on the first violation.
    "core/network/src/application/conformance.rs",
]
respect_gitignore = true

# --- architectural scopes ---------------------------------------------------

[[scopes]]
name = "domain"
paths = ["core/engine/src/domain/**"]

[[scopes]]
name = "application"
paths = ["core/engine/src/application/**"]

[[scopes]]
name = "engine"
paths = ["core/engine/**"]

[[scopes]]
name = "runtime_rhai"
paths = ["core/runtime/rhai/**"]

# The domain-coupled bridges (DOM now; CSS/graphics/network/window in v0.5) live
# here, split out of `runtime_rhai` so the backend names no domain crate
# (v0.5 report §2.12, the "R" step). The glob `core/runtime/rhai/**` does not
# match `rhai-bindings`, so the two scopes stay disjoint.
[[scopes]]
name = "runtime_rhai_bindings"
paths = ["core/runtime/rhai-bindings/**"]

[[scopes]]
name = "alloy_cli"
paths = ["alloy/**"]

[[scopes]]
name = "dom_domain"
paths = ["core/dom/src/domain/**"]

[[scopes]]
name = "dom_application"
paths = ["core/dom/src/application/**"]

[[scopes]]
name = "dom"
paths = ["core/dom/**"]

[[scopes]]
name = "graphics_domain"
paths = ["core/graphics/src/domain/**"]

[[scopes]]
name = "graphics_application"
paths = ["core/graphics/src/application/**"]

[[scopes]]
name = "graphics"
paths = ["core/graphics/**"]

[[scopes]]
name = "css_domain"
paths = ["core/css/src/domain/**"]

[[scopes]]
name = "css_application"
paths = ["core/css/src/application/**"]

[[scopes]]
name = "css"
paths = ["core/css/**"]

[[scopes]]
name = "network_domain"
paths = ["core/network/src/domain/**"]

[[scopes]]
name = "network_application"
paths = ["core/network/src/application/**"]

[[scopes]]
name = "network"
paths = ["core/network/**"]

# --- layer dependency rules (hexagonal architecture) ------------------------

# Domain layer must not depend on application, runtime adapters, or CLI
[[deny-scope-dep]]
from = "domain"
to = ["application", "runtime_rhai", "alloy_cli"]
message = "Domain layer must not depend on application ports or runtime infrastructure (ADR-0011)."

# Engine port abstraction must not depend on concrete runtime adapters or CLI
[[deny-scope-dep]]
from = "engine"
to = ["runtime_rhai", "alloy_cli"]
message = "Engine abstraction crate must not depend on concrete script runtimes or CLI (ADR-0002 / ADR-0011)."

# DOM domain layer must not depend on application layer or other subsystems
[[deny-scope-dep]]
from = "dom_domain"
to = ["dom_application", "engine", "runtime_rhai", "alloy_cli"]
message = "DOM domain layer must not depend on application layer, engine ports, runtime, or CLI."

# DOM crate must not depend on engine, runtime adapters, bindings, or CLI
[[deny-scope-dep]]
from = "dom"
to = ["engine", "runtime_rhai", "runtime_rhai_bindings", "alloy_cli"]
message = "core/dom must not depend on engine, concrete script runtimes, the bindings crate, or CLI."

# core/runtime/rhai is the pure engine-port backend after the R split: it must not
# name a domain crate, the bindings crate, or the CLI. The DOM bridge and every
# later CSS/graphics/network/window bridge lives in rhai-bindings (v0.5 §2.12).
[[deny-scope-dep]]
from = "runtime_rhai"
to = ["dom", "runtime_rhai_bindings", "alloy_cli"]
message = "core/runtime/rhai must name no domain crate — the bridges live in rhai-bindings (v0.5 report §2.12)."

# Graphics domain layer must not depend on application layer or other subsystems
[[deny-scope-dep]]
from = "graphics_domain"
to = ["graphics_application", "engine", "runtime_rhai", "alloy_cli"]
message = "Graphics domain layer must not depend on application layer, engine ports, runtime, or CLI."

# core/graphics is a pure rasterization domain: no DOM, no CSS, no engine, no runtime.
# Every script bridge lives in core/runtime/rhai (v0.3 report decision 2.1), which is
# also why docs/architecture/overview.md no longer lists `graphics -> engine`.
[[deny-scope-dep]]
from = "graphics"
to = ["engine", "runtime_rhai", "alloy_cli", "dom"]
message = "core/graphics must not depend on engine, DOM, concrete script runtimes, or CLI (PRD-005:62-63)."

# CSS domain layer must not depend on the application layer or any adapter crate.
[[deny-scope-dep]]
from = "css_domain"
to = ["css_application", "engine", "runtime_rhai", "runtime_rhai_bindings", "alloy_cli"]
message = "CSS domain layer must not depend on application ports, engine, runtime, bindings, or CLI."

# core/css realises the cascade/layout ports without naming the engine or a
# script runtime — the scriptable adapter lives in rhai-bindings (PRD-007:64-67).
# It MAY depend on core/dom and core/graphics (shared units, ADR-0016), so those
# are deliberately absent from this list.
[[deny-scope-dep]]
from = "css"
to = ["engine", "runtime_rhai", "runtime_rhai_bindings", "alloy_cli"]
message = "core/css must not depend on engine, concrete script runtimes, the bindings crate, or CLI (PRD-007). It may depend on dom and graphics."

# Network domain layer must not depend on the application layer or any adapter crate.
[[deny-scope-dep]]
from = "network_domain"
to = ["network_application", "engine", "runtime_rhai", "runtime_rhai_bindings", "alloy_cli"]
message = "Network domain layer must not depend on application ports, engine, runtime, bindings, or CLI."

# core/network is a pure transport-and-policy domain: no engine, no runtime, no
# other subsystem. The scriptable RequestPolicy of Phase M lives in
# rhai-bindings; the `layering` CI job holds this line (PRD-009, ADR-0019).
[[deny-scope-dep]]
from = "network"
to = ["engine", "runtime_rhai", "runtime_rhai_bindings", "alloy_cli", "dom", "css", "graphics"]
message = "core/network must not depend on engine, DOM, CSS, graphics, script runtimes, the bindings crate, or CLI (PRD-009)."

# --- import restrictions ---------------------------------------------------

# Engine must not import any concrete script runtime crate (ADR-0002:49 / ADR-0011 item 2)
[[restrict-use]]
name = "engine-interpreter-free"
scope = "engine"
deny = [
    "rhai::*",
    "boa_engine::*",
    "rquickjs::*",
    "deno_core::*",
    "v8::*",
    "mlua::*",
    "rlua::*",
]
message = "core/engine must remain script-interpreter free (ADR-0002:49 / ADR-0011 item 2)."

# Crate preference: prefer tracing over log
[[require-use]]
name = "prefer-tracing"
files = ["core/**", "alloy/**"]
prefer = "tracing"
over = ["log"]
message = "Use tracing instead of log for structured logging (ADR-0014)."

# --- enabled: the rules that map to a concrete review ask --------------------

# G3 / ADR-0008: no `.unwrap()` / `.expect()` in production code. Tests opt out
# (mirrors clippy.toml `allow-unwrap-in-tests` / `allow-expect-in-tests`).
[rules.no-unwrap-expect]
enabled = true
allow_in_tests = true

# G1 / ADR-0014: the `log` facade is not used here — `tracing` is the only
# logging surface.
[rules.require-tracing]
enabled = true

# G1 / ADR-0014: the subscriber must take its level from the environment
# (`EnvFilter`), never a hardcoded `Level::INFO`.
[rules.tracing-env-init]
enabled = true

# --- disabled: rules that fight a deliberate, documented idiom --------------

# `EngineError` keeps a hand-written `Display` / `Error` on purpose — `core/engine`
# is the port boundary and takes no proc-macro dependency (see ADR-0015 §scope).
[rules.require-thiserror]
enabled = false

# `x.lock().unwrap_or_else(|poison| poison.into_inner())` is the chosen
# mutex-poison-recovery idiom (a panicked holder must not wedge the host); it is
# not an error being swallowed.
[rules.no-silent-result-drop]
enabled = false

[rules.no-error-swallowing]
enabled = false

# Not an async codebase yet.
[rules.no-sync-io]
enabled = false

[rules.handler-complexity]
enabled = false
