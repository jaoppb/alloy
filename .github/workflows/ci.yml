name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the whole workflow starts with no token scopes.
# Each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---- cheap gates first: markdown + rust style ----------------------------
  markdown:
    name: Markdown (prettier + markdownlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm must exist before setup-node@v7 resolves the `packageManager` field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:md

  rust-quality:
    name: Rust format + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner honours rust-toolchain.toml (channel + components).
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---- expensive gate: full test matrix on the 3 target OSes --------------
  test:
    name: Test (${{ matrix.os }})
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-features

  # ---- ADR-0002 / ADR-0011 N-04: layering — no crate links a subsystem it
  # must not (renamed from `no-engine` in v0.5 Phase P: the checks below cover
  # every subsystem's layering rule, not only the engine's, since B4/B5/C1/C2) -
  layering:
    name: Layering — no crate links a subsystem it must not
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-noengine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-noengine-
      - run: cargo build -p engine --all-features
      - run: cargo test -p dom --no-default-features
      - run: cargo test -p css --no-default-features
      - run: cargo test -p html --no-default-features
      - run: cargo test -p network --no-default-features
      - run: cargo test -p window --no-default-features
      # PRD-007: core/css realises the cascade/layout ports without linking the
      # engine or a script runtime — the scriptable adapter lives in
      # rhai-bindings. It may depend on dom and graphics, and nothing else.
      - name: css links no engine or script runtime
        run: |
          if cargo tree -p css --edges normal --prefix none | grep -Eiq '^(engine|rhai|rhai-runtime|rhai-bindings) '; then
            echo "✗ core/css linked the engine or a script runtime"
            exit 1
          fi
          echo "✓ core/css is engine/rhai free"
      # PRD-009 / ADR-0019: core/network is a pure transport-and-policy domain.
      # The scriptable RequestPolicy lives in rhai-bindings (Phase M).
      - name: network links no engine, runtime or other subsystem
        run: |
          if cargo tree -p network --edges normal --prefix none | grep -Eiq '^(engine|rhai|rhai-runtime|rhai-bindings|dom|css|graphics) '; then
            echo "✗ core/network linked the engine, a script runtime or another subsystem"
            exit 1
          fi
          echo "✓ core/network is engine/rhai/subsystem free"
      # PRD-008 / B5: core/html realises the TokenSink/TreeSink ports over
      # core/dom without naming the engine or a script runtime.
      - name: html links no engine or script runtime
        run: |
          if cargo tree -p html --edges normal --prefix none | grep -Eiq '^(engine|rhai|rhai-runtime|rhai-bindings) '; then
            echo "✗ core/html linked the engine or a script runtime"
            exit 1
          fi
          echo "✓ core/html is engine/rhai free"
      # v0.5 report §2.12 (R): the pure Rhai backend must name no domain crate —
      # the domain bridges live in `rhai-bindings`. `just no-engine` also asserts
      # `rhai-runtime -> !dom` locally; this keeps it green in CI.
      - name: rhai-runtime links no domain crate
        run: |
          if cargo tree -p rhai-runtime --edges normal --prefix none | grep -Eq '^dom '; then
            echo "✗ core/runtime/rhai depends on core/dom — move the bridge to rhai-bindings"
            exit 1
          fi
          echo "✓ core/runtime/rhai is domain-crate free"
      # PRD-010 / ADR-0019: core/window is a pure window-system-and-presenter
      # domain — no engine, no runtime, no other subsystem, and (unlike
      # core/css) no core/graphics either; FrameView is the seam that keeps
      # that edge from existing. The scriptable UI policy of Phase M lives in
      # rhai-bindings.
      - name: window links no engine, runtime or other subsystem
        run: |
          if cargo tree -p window --edges normal --prefix none | grep -Eiq '^(engine|rhai|rhai-runtime|rhai-bindings|dom|css|graphics|network) '; then
            echo "✗ core/window linked the engine, a script runtime or another subsystem"
            exit 1
          fi
          echo "✓ core/window is engine/rhai/subsystem free"
      # ADR-0011 item 6: --no-default-features is the no-window build — it must
      # link neither winit nor softbuffer at all.
      - name: window --no-default-features links neither winit nor softbuffer
        run: |
          if cargo tree -p window --no-default-features --edges normal --prefix none | grep -Eiq '^(winit|softbuffer) '; then
            echo "✗ core/window --no-default-features still links winit/softbuffer"
            exit 1
          fi
          echo "✓ core/window --no-default-features (no-window) links neither winit nor softbuffer"

  # ---- relatório §2.8:350-354: the declared CSS cut cannot shrink silently --
  css-conformance:
    name: CSS + HTML support manifests
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cssconf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cssconf-
      # Three statements of the same cut — core/css/tests/data/MANIFEST.md, the
      # SUPPORTED_PROPERTIES / SUPPORTED_SELECTORS registries, and what the
      # parser really accepts — must agree in every direction. There is no bless
      # path: a generated manifest would agree by construction. B5 adds
      # `-p html --test manifest_runner` here for the html5lib-class cut.
      - run: cargo test -p css --test manifest_runner
      - run: cargo test -p html --test manifest_runner

  # ---- PRD-003:79 / roadmap §5: fault isolation by panic injection ---------
  fault-injection:
    name: Panic-injection fault isolation
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fault-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fault-
      # A panic injected into a guarded binding must be trapped as ScriptPanic
      # with the process alive; run_dom_with_fallback must recover from every
      # error class. --test-threads=1 keeps the process-global panic hook
      # deterministic. Fails immediately if any profile sets `panic = "abort"`.
      # The suite moved to `rhai-bindings` with the DOM bridge (v0.5 report §2.12).
      - run: cargo test -p rhai-bindings --test fault_injection -- --test-threads=1

  # ---- PRD-001 N-01 / v0.5 Phase M: the <10us per-hook budget must not regress -
  hook-benchmark:
    name: Hook dispatch overhead
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-benchmark-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-benchmark-
      # ci/hook_benchmark.sh checks the measured mean against both the
      # absolute PRD-001 N-01 ceiling (<10us) and a generous multiple of the
      # committed baseline (core/runtime/rhai/benches/baselines/hook_overhead.json).
      - run: ci/hook_benchmark.sh

  # ---- ADR-0018 row 1 surfaces: fuzz the hostile-byte decoders ---------------
  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [inflate, png_decode, css_parse]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-
      - name: Install nightly (cargo-fuzz requires it)
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: test -x ~/.cargo/bin/cargo-fuzz || cargo install cargo-fuzz --locked
      # 10 minutes per target (ADR-0018 row 1: TLS/HTTP/HTML/CSS/image/font
      # decoders must never panic on hostile bytes) — zero crashes expected.
      # Run from the repo root: cargo-fuzz auto-discovers ./fuzz/Cargo.toml,
      # the same convention `fuzz/` already documents (kept outside the main
      # workspace on purpose).
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-0.20
      - name: Install cargo-deny
        run: |
          test -x ~/.cargo/bin/cargo-deny || cargo install cargo-deny --locked --version ^0.20
      - run: cargo deny check

  # ---- ADR-0018: `unsafe` governed by threat surface -----------------------
  # Blocking from v0.5 Phase P: `ci/unsafe_audit.sh` runs the `--forbid-only`
  # sweep, then a full `cargo-geiger` scan reduced to this workspace's direct
  # third-party dependencies, failing if one carries `unsafe` outside the
  # reviewed `unsafe-allowlist.toml`. See that script's header for why the
  # scope is direct dependencies, not the whole transitive graph.
  unsafe-audit:
    name: unsafe audit
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-geiger
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-geiger-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-geiger-
      - name: Install cargo-geiger
        run: test -x ~/.cargo/bin/cargo-geiger || cargo install cargo-geiger --locked
      - run: ci/unsafe_audit.sh

  # ---- architecture rules & layer enforcement (ADR-0002 / ADR-0011 / ADR-0014) -----
  arch-lint:
    name: arch-lint
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/arch-lint
          key: arch-lint-bin-0.5
      - name: Install arch-lint
        run: |
          test -x ~/.cargo/bin/arch-lint || cargo install arch-lint-cli --locked --version ^0.5
      - run: arch-lint check

  coverage:
    name: domain/ coverage
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/bin/cargo-llvm-cov
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-
      - name: Install cargo-llvm-cov
        run: test -x ~/.cargo/bin/cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      # domain/ has no I/O and no excuse — roadmap §5 sets the v0.1 gate at 85%.
      - name: Coverage for engine domain/
        run: >
          cargo llvm-cov --package engine --all-features
          --lcov --output-path lcov.info
          --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
      # v0.5 Phase P: extend the domain/ gate to the four ports B4/B5/C1/C2
      # added. Scoped to domain/ only (excludes application/ and
      # infrastructure/, which carry real I/O and adapter plumbing that a
      # domain-coverage gate was never meant to measure) via
      # --ignore-filename-regex, the same way the engine gate above is
      # implicitly domain-only because that crate is mostly domain/.
      - name: Coverage for css/network/window/html domain/
        run: >
          cargo llvm-cov --package css --package network --package window --package html --all-features
          --ignore-filename-regex '(/application/|/infrastructure/)'
          --lcov --output-path lcov-v0-5.info
          --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov-v0-5
          path: lcov-v0-5.info
