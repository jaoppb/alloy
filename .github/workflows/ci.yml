name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the whole workflow starts with no token scopes.
# Each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  # ---- cheap gates first: markdown + rust style ----------------------------
  markdown:
    name: Markdown (prettier + markdownlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # pnpm must exist before setup-node@v7 resolves the `packageManager` field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:md

  rust-quality:
    name: Rust format + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner honours rust-toolchain.toml (channel + components).
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---- expensive gate: full test matrix on the 3 target OSes --------------
  test:
    name: Test (${{ matrix.os }})
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-features

  # ---- ADR-0002 / ADR-0011 N-04: the engine abstraction links no runtime --
  no-engine:
    name: Engine abstraction is adapter-free
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-noengine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-noengine-
      - run: cargo build -p engine --all-features
      - name: Assert no script interpreter in engine's dependency graph
        run: |
          if cargo tree -p engine --edges normal --prefix none | grep -Eiq '^(rhai|boa_engine|rquickjs|deno_core|v8|mlua|rlua) '; then
            echo "::error::core/engine linked a concrete script runtime — ADR-0002:49 / ADR-0011 item 2 violated"
            cargo tree -p engine --edges normal
            exit 1
          fi
          echo "engine dependency graph is interpreter-free:"
          cargo tree -p engine --edges normal
      # v0.2 report decision 2.1: core/dom is a pure domain crate with NO deps —
      # so html/css/js never inherit an interpreter transitively (N-04).
      - run: cargo test -p dom --no-default-features
      - name: Assert core/dom has an empty dependency graph
        run: |
          deps="$(cargo tree -p dom --edges normal --prefix none | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "::error::core/dom gained a dependency — v0.2 decision 2.1 (dom stays domain-pure) violated"
            cargo tree -p dom --edges normal
            exit 1
          fi
          echo "core/dom dependency graph is empty."

  # ---- PRD-003:79 / roadmap §5: fault isolation by panic injection ---------
  fault-injection:
    name: Panic-injection fault isolation
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fault-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fault-
      # A panic injected into a guarded binding must be trapped as ScriptPanic
      # with the process alive; run_with_fallback must recover from every error
      # class. --test-threads=1 keeps the process-global panic hook deterministic.
      # Fails immediately if any profile sets `panic = "abort"`.
      - run: cargo test -p rhai-runtime --test fault_injection -- --test-threads=1


  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-0.20
      - name: Install cargo-deny
        run: |
          test -x ~/.cargo/bin/cargo-deny || cargo install cargo-deny --locked --version ^0.20
      - run: cargo deny check

  # ---- architecture rules & layer enforcement (ADR-0002 / ADR-0011 / ADR-0014) -----
  arch-lint:
    name: arch-lint
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/arch-lint
          key: arch-lint-bin-0.5
      - name: Install arch-lint
        run: |
          test -x ~/.cargo/bin/arch-lint || cargo install arch-lint-cli --locked --version ^0.5
      - run: arch-lint check

  coverage:
    name: domain/ coverage
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/bin/cargo-llvm-cov
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-
      - name: Install cargo-llvm-cov
        run: test -x ~/.cargo/bin/cargo-llvm-cov || cargo install cargo-llvm-cov --locked
      # domain/ has no I/O and no excuse — roadmap §5 sets the v0.1 gate at 85%.
      - name: Coverage for engine domain/
        run: >
          cargo llvm-cov --package engine --all-features
          --lcov --output-path lcov.info
          --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
