name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the whole workflow starts with no token scopes.
# Each job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Rustc warnings are denied through `build.warnings` in .cargo/config.toml, not a `RUSTFLAGS` env
# var: that would override `target.*.rustflags` and silently drop the mold linker (#153).
# `ci/verify_mold.sh` runs in every Linux job that compiles; markdown, arch-lint and cargo-deny
# compile nothing, so they have no artifact to check.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- cheap gates first: markdown + rust style ----------------------------
  markdown:
    name: Markdown (rumdl)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#markdown --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: markdown
      - run: rumdl check .

  rust-quality:
    name: Rust format + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#rust --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: rust
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-quality-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: ci/verify_mold.sh

  # ---- expensive gate: full test matrix on the 3 target OSes --------------
  test:
    name: Test (${{ matrix.os }})
    needs: rust-quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS run inside the flake (ADR-0029); windows-2022 is the one
        # Nix-free job: rustup reads rust-toolchain.toml.
        include:
          - os: ubuntu-24.04
            shell: nix develop .#rust --command bash -eo pipefail {0}
          - os: macos-15
            shell: nix develop .#rust --command bash -eo pipefail {0}
          - os: windows-2022
            shell: bash -eo pipefail {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        if: runner.os != 'Windows'
        with:
          shell: rust
      - name: Show toolchain
        if: runner.os == 'Windows'
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-features
      - if: runner.os == 'Linux'
        run: ci/verify_mold.sh

  # ---- ADR-0002 / ADR-0011 N-04: layering — no crate links a subsystem it
  # must not (renamed from `no-engine` in v0.5 Phase P: the checks below cover
  # every subsystem's layering rule, not only the engine's, since B4/B5/C1/C2) -
  layering:
    name: Layering — no crate links a subsystem it must not
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#rust --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: rust
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-noengine-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-noengine-
      - run: cargo build -p engine --all-features
      - run: cargo test -p dom --no-default-features
      - run: cargo test -p css --no-default-features
      - run: cargo test -p html --no-default-features
      - run: cargo test -p network --no-default-features
      - run: cargo test -p window --no-default-features
      - run: ci/verify_mold.sh
      # PRD-007 / PRD-008 / PRD-009 / PRD-010 / v0.5 report §2.12 (R): the
      # engine/script-runtime/subsystem import boundaries of core/css, core/network,
      # core/window and core/runtime/rhai are `restrict-use` rules in arch-lint.toml,
      # enforced by the `arch-lint` job below — no `cargo tree` grep needed here.
      # ADR-0011 item 6: --no-default-features is the no-window build — it must
      # link neither winit nor softbuffer at all. Enforced by the `arch-lint`
      # job's `window-backend-confined` restrict-use rule (arch-lint.toml),
      # which confines every `winit`/`softbuffer` import to the three
      # infra files gated by the `winit-system` feature — not a bespoke
      # `cargo tree | grep` step here.

  # ---- relatório §2.8:350-354: the declared CSS cut cannot shrink silently --
  css-conformance:
    name: CSS + HTML support manifests
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#rust --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: rust
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cssconf-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cssconf-
      # Three statements of the same cut — core/css/tests/data/MANIFEST.md, the
      # SUPPORTED_PROPERTIES / SUPPORTED_SELECTORS registries, and what the
      # parser really accepts — must agree in every direction. There is no bless
      # path: a generated manifest would agree by construction. B5 adds
      # `-p html --test manifest_runner` here for the html5lib-class cut.
      - run: cargo test -p css --test manifest_runner
      - run: cargo test -p html --test manifest_runner
      - run: ci/verify_mold.sh

  # ---- PRD-003:79 / roadmap §5: fault isolation by panic injection ---------
  fault-injection:
    name: Panic-injection fault isolation
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#rust --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: rust
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-fault-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fault-
      # A panic injected into a guarded binding must be trapped as ScriptPanic
      # with the process alive; run_dom_with_fallback must recover from every
      # error class. --test-threads=1 keeps the process-global panic hook
      # deterministic. Fails immediately if any profile sets `panic = "abort"`.
      # The suite moved to `rhai-bindings` with the DOM bridge (v0.5 report §2.12).
      - run: cargo test -p rhai-bindings --test fault_injection -- --test-threads=1
      - run: ci/verify_mold.sh

  # ---- PRD-001 N-01 / v0.5 Phase M: the <10us per-hook budget must not regress -
  hook-benchmark:
    name: Hook dispatch overhead
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#rust --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: rust
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-benchmark-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-benchmark-
      # ci/hook_benchmark.sh checks the measured mean against both the
      # absolute PRD-001 N-01 ceiling (<10us) and a generous multiple of the
      # committed baseline (core/runtime/rhai/benches/baselines/hook_overhead.json).
      - run: ci/hook_benchmark.sh
      - run: ci/verify_mold.sh target/release/deps

  # ---- ADR-0018 row 1 surfaces: fuzz the hostile-byte decoders ---------------
  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [inflate, png_decode, css_parse, html_parse]
    # The one RUSTFLAGS exception (#153): cargo-fuzz exports its sanitizer flags as `RUSTFLAGS`, which
    # replaces `target.*.rustflags` in .cargo/config.toml and would drop mold. Repeat the flag here;
    # cargo-fuzz appends its own to it. `ci/verify_mold.sh` below fails if it ever stops applying.
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    defaults:
      run:
        shell: nix develop .#fuzz --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: fuzz
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            fuzz/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-fuzz-
      # 10 minutes per target (ADR-0018 row 1: TLS/HTTP/HTML/CSS/image/font
      # decoders must never panic on hostile bytes) — zero crashes expected.
      # Run from the repo root: cargo-fuzz auto-discovers ./fuzz/Cargo.toml,
      # the same convention `fuzz/` already documents (kept outside the main
      # workspace on purpose).
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - run: ci/verify_mold.sh fuzz/target/x86_64-unknown-linux-gnu/release

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#supply-chain --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: supply-chain
      - run: cargo deny check

  # ---- ADR-0018: `unsafe` governed by threat surface -----------------------
  # Blocking from v0.5 Phase P: `ci/unsafe_audit.sh` runs the `--forbid-only`
  # sweep, then a full `cargo-geiger` scan reduced to this workspace's direct
  # third-party dependencies, failing if one carries `unsafe` outside the
  # reviewed `unsafe-allowlist.toml`. See that script's header for why the
  # scope is direct dependencies, not the whole transitive graph.
  unsafe-audit:
    name: unsafe audit
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#unsafe-audit --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: unsafe-audit
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-geiger-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-geiger-
      - run: ci/unsafe_audit.sh
      - run: ci/verify_mold.sh

  # ---- architecture rules & layer enforcement (ADR-0002 / ADR-0011 / ADR-0014) -----
  arch-lint:
    name: arch-lint
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#arch --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: arch
      - run: arch-lint check

  coverage:
    name: domain/ coverage
    needs: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop .#coverage --command bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix-shell
        with:
          shell: coverage
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-
      # domain/ has no I/O and no excuse — roadmap §5 sets the v0.1 gate at 85%.
      - name: Coverage for engine domain/
        run: >
          cargo llvm-cov --package engine --all-features
          --lcov --output-path lcov.info
          --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
      # v0.5 Phase P: extend the domain/ gate to the four ports B4/B5/C1/C2
      # added. Scoped to domain/ only (excludes application/ and
      # infrastructure/, which carry real I/O and adapter plumbing that a
      # domain-coverage gate was never meant to measure) via
      # --ignore-filename-regex, the same way the engine gate above is
      # implicitly domain-only because that crate is mostly domain/.
      - name: Coverage for css/network/window/html domain/
        run: >
          cargo llvm-cov --package css --package network --package window --package html --all-features
          --ignore-filename-regex '(/application/|/infrastructure/)'
          --lcov --output-path lcov-v0-5.info
          --fail-under-lines 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov-v0-5
          path: lcov-v0-5.info
      - run: ci/verify_mold.sh target/llvm-cov-target/debug/deps
