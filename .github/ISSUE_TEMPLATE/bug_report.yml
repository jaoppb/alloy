name: Bug Report
description: Report something in Alloy that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to report a bug. **If this is a security vulnerability, do not file it here** —
              see [SECURITY.md](https://github.com/jaoppb/alloy/blob/main/SECURITY.md) for private reporting instead.

    - type: textarea
      id: description
      attributes:
          label: What happened?
          description: A clear and concise description of the bug.
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: What did you expect to happen?
      validations:
          required: true

    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          description: Include the exact command(s) you ran (e.g. `just run --script scripts/hello.rhai`) and, if
              relevant, a minimal `.rhai` script that triggers the bug.
          placeholder: |
              1. Run `...`
              2. See error `...`
      validations:
          required: true

    - type: textarea
      id: logs
      attributes:
          label: Relevant logs / output
          description: Paste any relevant `tracing` output, panic message, or `cargo`/`just` error. This will be
              rendered as a code block automatically.
          render: shell

    - type: input
      id: commit
      attributes:
          label: Commit / branch
          description: Which commit hash or branch were you on?
      validations:
          required: true

    - type: input
      id: rust-version
      attributes:
          label: Rust toolchain version
          description: Output of `rustc --version` (should match `rust-toolchain.toml`).
      validations:
          required: false

    - type: dropdown
      id: os
      attributes:
          label: Operating System
          options:
              - Linux
              - macOS
              - Windows
              - Other
      validations:
          required: true

    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Anything else relevant — related ADR/PRD, related crate, screenshots, etc.
