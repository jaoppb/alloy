# unsafe-allowlist.toml — the reviewed record of every dependency permitted to
# contain `unsafe`, per ADR-0018 ("`unsafe` governed by threat surface").
#
# Every hand-written crate in this workspace keeps `#![forbid(unsafe_code)]`
# without exception. This file governs the *dependency tree*. It grows ONLY by
# review, never by accident, and MUST NEVER contain a crate that decodes bytes
# coming from the network (ADR-0018 rule, row 1) — the `unsafe-audit` CI job
# asserts that.
#
# `reason` must name the ADR-0018 row it invokes:
#   row 1 — attacker-controlled bytes; FORBIDDEN by default. Only ever present as an
#           explicit, temporary EXCEPTION recorded in ADR-0018 + the relevant PRD.
#   row 2 — trusted muscle script (Rhai binding dispatch); nominal
#   row 3 — platform FFI with no alternative; nominal
#
# Convenience `unsafe` (SIMD, custom allocators) is NEVER allowlisted (row 4).

[[allow]]
crate = "rhai"
row = 2
reason = """
`rhai =1.26.0` has four `unsafe` blocks, three on the binding-registration /
native-call seam (transmute_copy behind a TypeId check — the standard dynamic
dispatch pattern). The muscle script is modelled as buggy, not adversarial
(PRD-003:21-24); the author is the user. This entry is time-limited: in v0.7
`core/js` runs adversarial script and its engine choice (ADR-0012) falls under
row 1, not row 2. See docs/reports/VIOLACAO-N02-UNSAFE-NO-RHAI.md.
"""

# --- v0.5 network track (C0 spike finding; consumed from C1) ----------------
# EXCEPTION — the first and, for v0.5, only row-1 entry. See
# docs/reports/SPIKE-C0-TLS-PROVIDER.md and ADR-0018 §"The RustCrypto carve-out".
[[allow]]
crate = "ring"
row = 1
reason = """
row 1 EXCEPTION. `ring =0.17.14` is the `rustls` CryptoProvider
(`rustls::crypto::ring::default_provider()`): hand-written x86-64/aarch64 assembly
plus a little C, compiled at build time with `cc`, on the surface that decrypts TLS
records and verifies certificate signatures — exactly what ADR-0018 row 1 forbids
for third parties.

Accepted knowingly and temporarily under ADR-0018's pre-authorised carve-out. The
Phase C0 spike (docs/reports/SPIKE-C0-TLS-PROVIDER.md) found the pure-Rust
alternative is NO-GO: `rustls-rustcrypto` is `0.0.2-alpha` (no stable release since
2024), forces a `deny.toml`-banned duplicate `rustls-webpki` (0.102 vs 0.103), and
is not itself `unsafe`-free (AES-NI / SHA / curve25519-dalek intrinsics across ~54
crates). `ring` concentrates the assembly `unsafe` in one FIPS-lineage,
widely-audited crate (26-crate tree vs 105); `rustls` itself, `rustls-webpki` and
`untrusted` — the parts that parse attacker bytes — carry no `unsafe` in `src/`.

Time-limited: revisit when a stable pure-Rust RustCrypto `CryptoProvider` pins
cleanly against current `rustls` + `rustls-webpki`, or if FIPS forces `aws-lc-rs`.
To be recorded in full in PRD-009 §threat-model (Phase P). `aws-lc-rs` is the other
pre-authorised option (heavier 3-OS build, no `unsafe` advantage over `ring`).
"""

# --- v0.5 window track (Phase C2) -------------------------------------------
[[allow]]
crate = "winit"
row = 3
reason = """
`winit =0.30.13` opens native windows and drives the OS event loop
(`ADR-0019`) — window creation, surface binding and message-pump FFI on
X11/Wayland/Win32/AppKit, none of which has an `unsafe`-free implementation on
any of the 3 target OSes (`breadx`/`x11rb` are X11-only; every platform
windowing crate still crosses into C FFI at the syscall/Objective-C-message
boundary). This is platform FFI with no hostile input on the wire: `winit`
processes OS window-manager and input-device events, not attacker-controlled
network bytes, so it falls under ADR-0018 row 3, not row 1.
"""

[[allow]]
crate = "softbuffer"
row = 3
reason = """
`softbuffer =0.4.8` blits a `core/window::FrameView` onto a window's native
surface (Wayland `wl_shm`, X11 `XShm`/`MIT-SHM`, Win32 `GDI`, AppKit
`CALayer`) — the same class of OS surface FFI as `winit`, and the reason
`core/window::infrastructure::softbuffer_presenter` exists instead of a
hand-rolled blit. No hostile bytes on this surface either: it copies a buffer
this workspace already produced into OS-owned shared memory.
"""

# --- ADR-0014 diagnostics stack (found by the Phase P direct-dependency scan) -
# NOTE for whoever next revises ADR-0018: neither entry below is platform FFI —
# "row 3" is a stretch, recorded honestly as one here rather than silently
# omitted. `tracing`/`tracing-subscriber`'s `unsafe` is internal span/subscriber
# bookkeeping (thread-local registry slots, `Once`-guarded statics), not FFI and
# not attacker-controlled-byte parsing. It doesn't cleanly fit any of the three
# nominal rows, but ADR-0014 already mandates `tracing` workspace-wide, so
# forbidding it (row 4, "convenience") is not an available option either. This
# is the one gap `ci/unsafe_audit.sh` surfaced that the four-row taxonomy does
# not name a home for — a future ADR-0018 revision should probably add a row for
# "cross-cutting infrastructure mandated by another ADR, no unsafe-free
# alternative published" rather than keep stretching row 3 to cover it.
[[allow]]
crate = "tracing"
row = 3
reason = """
`tracing =0.1.44` (18 unsafe items). Thread-local/`Once`-guarded static access
in the span/subscriber dispatch core — required for the sub-microsecond
per-event overhead ADR-0014 structured logging depends on. No attacker-
controlled bytes on this surface; not literally platform FFI (see the note
above this entry). Direct dependency of `alloy`, `rhai-runtime`, `rhai-bindings`.
"""

[[allow]]
crate = "tracing-subscriber"
row = 3
reason = """
`tracing-subscriber =0.3.23` (149 unsafe items, mostly transitive re-exports
counted at this crate's own registry/filter layer — `sharded-slab`/
`thread_local` internals). Same reasoning as the `tracing` entry above: no
hostile bytes, mandated by ADR-0014, no unsafe-free alternative published.
Direct dependency of `alloy` (`tracing_subscriber::EnvFilter` init).
"""

# --- Enforcement mechanism (settled in v0.5 Phase P) ------------------------
# `cargo-geiger 0.13` installs and runs under toolchain 1.97.1. The
# "target-resolution bug" noted in Phase 0 was specific to running geiger
# against the *workspace root* virtual manifest; pointed at a real package
# manifest (`--manifest-path alloy/Cargo.toml`, which pulls in the whole graph
# through `alloy`'s own dependency tree) both `--forbid-only` and the full
# `--output-format Json` scan run cleanly. `ci/unsafe_audit.sh` is the
# settled mechanism: it runs the `--forbid-only` sweep, then reduces the full
# JSON scan to this workspace's *direct* third-party dependencies (via `cargo
# metadata`) and fails if one carries `unsafe` and is not listed in this file.
# The `unsafe-audit` CI job is **blocking** from Phase P — see
# `.github/workflows/ci.yml` and `justfile`'s `unsafe-audit` recipe.
