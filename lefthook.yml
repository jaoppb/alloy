# Lefthook Git Hooks Configuration for Alloy
# Documentation: https://github.com/evilmartians/lefthook

pre-commit:
  parallel: false
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true

    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    markdown-fmt:
      glob: "*.md"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true

    markdown-lint:
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}

pre-push:
  parallel: false
  commands:
    rust-test:
      run: cargo test --workspace

    rust-check:
      run: cargo check --workspace --all-targets
